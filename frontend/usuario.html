<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Piterest</title>
    <meta name="description" content="Tu perfil en Piterest: gestiona publicaciones, seguidores y configuración.">
    <link rel="stylesheet" href="usuario.css">
    <script>
        if (!sessionStorage.getItem('username')) window.location.href = 'login.html';
    </script>
    <style>
        /* ── Estadísticas seguidores ─────────────────────────── */
        .perfil-stats {
            display: flex; gap: 20px; justify-content: center;
            margin: 14px 0 6px;
        }
        .stat-box {
            text-align: center;
            background: rgba(123,44,191,0.12);
            border: 1px solid rgba(123,44,191,0.25);
            border-radius: 14px;
            padding: 10px 22px;
            cursor: pointer;
            transition: background 0.18s, transform 0.14s;
        }
        .stat-box:hover { background: rgba(123,44,191,0.22); transform: scale(1.04); }
        .stat-number { font-size: 22px; font-weight: 800; color: #c77dff; display: block; }
        .stat-label  { font-size: 12px; color: #aaa; font-weight: 600; letter-spacing: 0.5px; }

        /* ── Tabs ────────────────────────────────────────────── */
        .tabs-bar {
            display: flex; gap: 4px;
            padding: 0 30px; margin-bottom: 20px;
            border-bottom: 1px solid rgba(123,44,191,0.2);
        }
        .tab-btn {
            padding: 12px 22px; font-size: 14px; font-weight: 700;
            background: transparent; border: none; border-bottom: 3px solid transparent;
            color: #888; cursor: pointer; transition: color 0.18s, border-color 0.18s;
            white-space: nowrap;
        }
        .tab-btn.active { color: #c77dff; border-bottom-color: #c77dff; }
        .tab-btn:hover  { color: #c77dff; }

        /* ── Edición de perfil ───────────────────────────────── */
        .profile-edit-section {
            background: rgba(123,44,191,0.08);
            border: 1px solid rgba(123,44,191,0.2);
            border-radius: 18px;
            padding: 26px;
            margin: 0 30px 30px;
        }
        .profile-edit-section h3 {
            color: #c77dff; font-size: 16px; margin-bottom: 18px;
            display: flex; align-items: center; gap: 8px;
        }
        .edit-field { margin-bottom: 16px; }
        .edit-field label { display: block; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 7px; }
        .edit-input {
            width: 100%; padding: 11px 14px;
            background: #1e1e2e; border: 1px solid rgba(123,44,191,0.35);
            border-radius: 10px; color: white; font-size: 14px; outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .edit-input:focus { border-color: #c77dff; box-shadow: 0 0 8px rgba(199,125,255,0.25); }
        .edit-input::placeholder { color: #555; }
        textarea.edit-input { resize: vertical; min-height: 80px; font-family: inherit; }
        .btn-save-profile {
            padding: 11px 24px;
            background: linear-gradient(135deg, #7b2cbf, #c77dff);
            color: white; border: none; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-save-profile:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(157,78,221,0.5); }
        .btn-save-profile:disabled { opacity: 0.6; cursor: not-allowed; }
        .edit-success { color: #10b981; font-size: 13px; margin-top: 8px; display: none; }
        .edit-error   { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }

        /* ── Modal seguidores/seguidos ───────────────────────── */
        .user-list-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
            z-index: 900; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.22s;
        }
        .user-list-overlay.open { opacity: 1; pointer-events: all; }
        .user-list-modal-content {
            background: linear-gradient(145deg,#1a0a2e,#130020);
            border: 1px solid rgba(123,44,191,0.45);
            border-radius: 20px; width: 360px; max-width: calc(100vw - 32px);
            max-height: 70vh; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 24px 60px rgba(123,44,191,0.25);
        }
        .user-list-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 22px 14px;
            border-bottom: 1px solid rgba(123,44,191,0.18);
        }
        .user-list-header h3 { color: #c77dff; font-size: 16px; margin: 0; }
        .user-list-close {
            background: rgba(255,255,255,0.07); border: none; color: #aaa;
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: background 0.18s;
        }
        .user-list-close:hover { background: #ef4444; color: white; }
        .user-list-body { overflow-y: auto; padding: 10px 0; flex: 1; }
        .user-list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 22px;
            border-bottom: 1px solid rgba(123,44,191,0.08);
            transition: background 0.15s;
        }
        .user-list-item:hover { background: rgba(123,44,191,0.1); }
        .user-list-avatar {
            width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(123,44,191,0.4);
        }
        .user-list-item-name { color: #e0e0e0; font-size: 14px; font-weight: 600; }
        .user-list-empty { color: #666; font-size: 14px; text-align: center; padding: 30px 20px; }

        /* ── Galería tabs ──────────────────────────────────────── */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">
            <a href="index.html" style="text-decoration:none;color:inherit;"><h1>Piterest</h1></a>
        </div>
        <div class="header-acciones">
            <button class="btn-publicar-header" id="btn-pub-header" onclick="abrirModalPublicar()">＋ Publicar</button>
        </div>
    </header>

    <!-- Perfil -->
    <section class="perfil">
        <div class="foto-perfil-wrapper">
            <div class="foto-perfil" id="foto-perfil-contenedor" title="Haz clic para cambiar tu foto">
                <img id="avatar-img" src="avatar.png" alt="Foto de perfil">
                <div class="foto-overlay"><span>📷 Cambiar</span></div>
                <input type="file" id="input-avatar" accept="image/*" style="display:none;" onchange="subirAvatar(event)">
            </div>
            <div id="avatar-loading" class="avatar-loading" style="display:none;">⏳ Subiendo...</div>
        </div>
        <h2 id="nombre-usuario-perfil" class="nombre-perfil">@Usuario</h2>
        <p id="bio-usuario" class="bio-perfil" style="display:none;"></p>

        <!-- Stats: seguidores / seguidos -->
        <div class="perfil-stats">
            <div class="stat-box" onclick="abrirListaUsuarios('followers')" id="stat-followers">
                <span class="stat-number" id="count-followers">0</span>
                <span class="stat-label">Seguidores</span>
            </div>
            <div class="stat-box" onclick="abrirListaUsuarios('following')" id="stat-following">
                <span class="stat-number" id="count-following">0</span>
                <span class="stat-label">Siguiendo</span>
            </div>
        </div>
    </section>

    <!-- Edición de perfil -->
    <div class="profile-edit-section">
        <h3>✏️ Personalizar perfil</h3>
        <div class="edit-field">
            <label for="edit-username">Nombre de usuario</label>
            <input type="text" id="edit-username" class="edit-input" placeholder="Nuevo nombre de usuario" maxlength="30">
        </div>
        <div class="edit-field">
            <label for="edit-bio">Biografía</label>
            <textarea id="edit-bio" class="edit-input" placeholder="Cuéntanos algo sobre ti…" maxlength="200"></textarea>
        </div>
        <button class="btn-save-profile" id="btn-save-profile" onclick="guardarPerfil()">Guardar cambios</button>
        <p class="edit-success" id="edit-success">✓ Perfil actualizado correctamente</p>
        <p class="edit-error"   id="edit-error"></p>
    </div>

    <!-- Tabs de publicaciones -->
    <section class="publicaciones">
        <div class="tabs-bar">
            <button class="tab-btn active" data-tab="mis-posts" onclick="cambiarTab(this)">📷 Mis publicaciones</button>
            <button class="tab-btn" data-tab="liked-posts"  onclick="cambiarTab(this)">❤️ Me gustaron</button>
            <button class="tab-btn" data-tab="saved-posts"  onclick="cambiarTab(this)">🔖 Guardados</button>
        </div>

        <!-- Mis publicaciones -->
        <div class="tab-panel active" id="panel-mis-posts">
            <div class="pub-header">
                <button class="btn-pub-inline" onclick="abrirModalPublicar()">＋ Nueva publicación</button>
            </div>
            <div class="galeria" id="galeria-usuario">
                <div class="pub-cargando" id="pub-cargando">
                    <div class="spinner"></div><p>Cargando publicaciones...</p>
                </div>
            </div>
        </div>

        <!-- Likes -->
        <div class="tab-panel" id="panel-liked-posts">
            <div class="galeria" id="galeria-liked">
                <div class="pub-cargando"><div class="spinner"></div><p>Cargando...</p></div>
            </div>
        </div>

        <!-- Guardados -->
        <div class="tab-panel" id="panel-saved-posts">
            <div class="galeria" id="galeria-saved">
                <div class="pub-cargando"><div class="spinner"></div><p>Cargando...</p></div>
            </div>
        </div>
    </section>

    <!-- FAB publicar -->
    <button class="fab-publicar visible" id="fab-publicar" title="Publicar imagen" onclick="abrirModalPublicar()">
        <span class="fab-icon">＋</span>
        <span class="fab-label">Publicar</span>
    </button>

    <!-- Modal publicar -->
    <div class="modal-overlay" id="modal-publicar" onclick="cerrarModalSiFondo(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="cerrarModalPublicar()" title="Cerrar">✕</button>
            <h2 class="modal-title">✨ Nueva publicación</h2>
            <div class="preview-zona" id="preview-zona">
                <div class="preview-placeholder" id="preview-placeholder">
                    <div class="preview-icon">🖼️</div>
                    <p>Haz clic o arrastra una imagen aquí</p>
                </div>
                <img id="preview-img" class="preview-img" alt="Vista previa" style="display:none;">
                <input type="file" id="input-imagen" accept="image/*" style="display:none;" onchange="previsualizarImagen(event)">
            </div>
            <div class="modal-campos">
                <input type="text" id="pub-titulo" class="modal-input" placeholder="Título de la publicación *" maxlength="100">
                <input type="text" id="pub-categoria" class="modal-input" placeholder="Categoría" list="categorias-sugeridas" maxlength="50">
                <datalist id="categorias-sugeridas">
                    <option value="Arte"><option value="Fotografía"><option value="Diseño">
                    <option value="Naturaleza"><option value="Tecnología"><option value="Comida"><option value="Viajes">
                </datalist>
                <textarea id="pub-descripcion" class="modal-textarea" placeholder="Descripción (opcional)" maxlength="300" rows="3"></textarea>
                <div id="pub-error" class="pub-error" style="display:none;"></div>
                <button class="btn-publicar-modal" id="btn-enviar-pub" onclick="enviarPublicacion()">
                    <span id="btn-pub-texto">🚀 Publicar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal lista de usuarios (seguidores/seguidos) -->
    <div class="user-list-overlay" id="user-list-overlay" onclick="cerrarListaUsuarios(event)">
        <div class="user-list-modal-content">
            <div class="user-list-header">
                <h3 id="user-list-title">Seguidores</h3>
                <button class="user-list-close" onclick="cerrarListaUsuarios()">✕</button>
            </div>
            <div class="user-list-body" id="user-list-body">
                <p class="user-list-empty">Cargando...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let username   = sessionStorage.getItem('username');
        let currentTab = 'mis-posts';

        // ── Carga inicial ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            if (!username) return;
            document.getElementById('nombre-usuario-perfil').textContent = '@' + username;
            document.getElementById('edit-username').value = username;
            await cargarPerfil();
            await cargarMisPosts();
        });

        // ── Perfil ───────────────────────────────────────────────────────────
        async function cargarPerfil() {
            try {
                const res  = await fetch(`${API_BASE}/profile/${encodeURIComponent(username)}`);
                if (!res.ok) return;
                const data = await res.json();

                if (data.avatar_url) {
                    document.getElementById('avatar-img').src = data.avatar_url + '?t=' + Date.now();
                }
                if (data.bio) {
                    const bioEl = document.getElementById('bio-usuario');
                    bioEl.textContent = data.bio;
                    bioEl.style.display = 'block';
                    document.getElementById('edit-bio').value = data.bio;
                }
                document.getElementById('count-followers').textContent = data.followers_count ?? 0;
                document.getElementById('count-following').textContent = data.following_count ?? 0;
            } catch(e) {}
        }

        // ── Guardar cambios de perfil ─────────────────────────────────────────
        async function guardarPerfil() {
            const newUsername = document.getElementById('edit-username').value.trim();
            const bio         = document.getElementById('edit-bio').value.trim();
            const successEl   = document.getElementById('edit-success');
            const errorEl     = document.getElementById('edit-error');
            const btn         = document.getElementById('btn-save-profile');

            successEl.style.display = 'none';
            errorEl.style.display   = 'none';
            btn.disabled = true; btn.textContent = 'Guardando...';

            try {
                const res = await fetch(`${API_BASE}/profile/${encodeURIComponent(username)}`, {
                    method: 'PUT',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        new_username: newUsername !== username ? newUsername : null,
                        bio: bio || null
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al guardar');

                // Si cambió el username actualizamos sesión
                if (data.username && data.username !== username) {
                    username = data.username;
                    sessionStorage.setItem('username', username);
                    document.getElementById('nombre-usuario-perfil').textContent = '@' + username;
                    document.getElementById('edit-username').value = username;
                }
                if (bio) {
                    const bioEl = document.getElementById('bio-usuario');
                    bioEl.textContent = bio; bioEl.style.display = 'block';
                }
                successEl.style.display = 'block';
                setTimeout(() => { successEl.style.display = 'none'; }, 3000);
            } catch(err) {
                errorEl.textContent = err.message; errorEl.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Guardar cambios';
            }
        }

        // ── Avatar ────────────────────────────────────────────────────────────
        document.getElementById('foto-perfil-contenedor').addEventListener('click', () => {
            document.getElementById('input-avatar').click();
        });

        async function subirAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const loading = document.getElementById('avatar-loading');
            loading.style.display = 'block';


            try {
                const res  = await fetch(`${API_BASE}/upload-avatar`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error');
                document.getElementById('avatar-img').src = data.avatar_url + '?t=' + Date.now();
            } catch(err) {
                alert('Error al cambiar la foto: ' + err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // ── Tabs ─────────────────────────────────────────────────────────────
        function cambiarTab(btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            const tab = btn.getAttribute('data-tab');
            document.getElementById('panel-' + tab).classList.add('active');
            currentTab = tab;

            if (tab === 'liked-posts') cargarLikedPosts();
            if (tab === 'saved-posts') cargarSavedPosts();
        }

        // ── Mis publicaciones ─────────────────────────────────────────────────
        async function cargarMisPosts() {
            const galeria = document.getElementById('galeria-usuario');
            try {
                const res   = await fetch(`${API_BASE}/posts/user/${encodeURIComponent(username)}`);
                const posts = await res.json();
                document.getElementById('pub-cargando').style.display = 'none';
                renderGaleria(galeria, posts, 'No has publicado nada aún.', true);
            } catch(e) {
                document.getElementById('pub-cargando').style.display = 'none';
                galeria.innerHTML = '<p style="color:#aaa;padding:20px;">No se pudieron cargar las publicaciones.</p>';
            }
        }

        // ── Posts gustados ────────────────────────────────────────────────────
        async function cargarLikedPosts() {
            const galeria = document.getElementById('galeria-liked');
            galeria.innerHTML = '<div class="pub-cargando"><div class="spinner"></div><p>Cargando...</p></div>';
            try {
                const res   = await fetch(`${API_BASE}/profile/${encodeURIComponent(username)}/liked-posts`);
                const posts = await res.json();
                renderGaleria(galeria, posts, 'Aún no has dado like a ninguna publicación.');
            } catch(e) {
                galeria.innerHTML = '<p style="color:#aaa;padding:20px;">Error al cargar.</p>';
            }
        }

        // ── Posts guardados ───────────────────────────────────────────────────
        async function cargarSavedPosts() {
            const galeria = document.getElementById('galeria-saved');
            galeria.innerHTML = '<div class="pub-cargando"><div class="spinner"></div><p>Cargando...</p></div>';
            try {
                const res   = await fetch(`${API_BASE}/profile/${encodeURIComponent(username)}/saved-posts`);
                const posts = await res.json();
                renderGaleria(galeria, posts, 'Aún no has guardado ninguna publicación.');
            } catch(e) {
                galeria.innerHTML = '<p style="color:#aaa;padding:20px;">Error al cargar.</p>';
            }
        }

        function renderGaleria(container, posts, emptyMsg, showNewBtn = false) {
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="sin-posts">
                        <div class="sin-posts-icon">📸</div>
                        <p>${emptyMsg}</p>
                        ${showNewBtn ? '<button onclick="abrirModalPublicar()" class="btn-primera-pub">Haz tu primera publicación</button>' : ''}
                    </div>`;
                return;
            }
            container.innerHTML = '';
            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = 'post';
                div.style.cursor = 'pointer';
                div.onclick = () => {
                    sessionStorage.setItem('postDetalle', JSON.stringify(p));
                    window.location.href = 'detalle.html';
                };
                div.innerHTML = `
                    <img src="${p.image_url}" alt="${p.title}" loading="lazy"
                         onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&h=600&fit=crop'">
                    <div class="post-info">
                        <h3>${p.title}</h3>
                        <span class="post-cat">${p.category || 'General'}</span>
                    </div>`;
                container.appendChild(div);
            });
        }

        // ── Modal seguidores/seguidos ─────────────────────────────────────────
        async function abrirListaUsuarios(tipo) {
            const overlay   = document.getElementById('user-list-overlay');
            const titleEl   = document.getElementById('user-list-title');
            const bodyEl    = document.getElementById('user-list-body');

            titleEl.textContent = tipo === 'followers' ? 'Seguidores' : 'Siguiendo';
            bodyEl.innerHTML = '<p class="user-list-empty">Cargando...</p>';
            overlay.classList.add('open');

            try {
                const endpoint = tipo === 'followers'
                    ? `/profile/${encodeURIComponent(username)}/followers`
                    : `/profile/${encodeURIComponent(username)}/following`;
                const res   = await fetch(endpoint);
                const users = await res.json();

                if (users.length === 0) {
                    bodyEl.innerHTML = `<p class="user-list-empty">${tipo === 'followers' ? 'Aún no tienes seguidores.' : 'No sigues a nadie aún.'}</p>`;
                    return;
                }
                bodyEl.innerHTML = users.map(u => `
                    <div class="user-list-item">
                        <img src="${u.avatar_url || '/avatar.png'}" alt="${u.username}" class="user-list-avatar"
                             onerror="this.src='/avatar.png'">
                        <span class="user-list-item-name">@${u.username}</span>
                    </div>`).join('');
            } catch(e) {
                bodyEl.innerHTML = '<p class="user-list-empty">Error al cargar.</p>';
            }
        }

        function cerrarListaUsuarios(e) {
            if (!e || e.target.id === 'user-list-overlay' || e.target.classList.contains('user-list-close') || typeof e === 'object' && !e.target) {
                document.getElementById('user-list-overlay').classList.remove('open');
            }
            if (typeof e === 'undefined') document.getElementById('user-list-overlay').classList.remove('open');
        }
        // Permitir llamada directa
        document.querySelector && document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.user-list-close').onclick = () =>
                document.getElementById('user-list-overlay').classList.remove('open');
        });

        // ── Modal publicar ────────────────────────────────────────────────────
        function abrirModalPublicar() {
            document.getElementById('modal-publicar').classList.add('abierto');
            document.body.style.overflow = 'hidden';
        }
        function cerrarModalPublicar() {
            document.getElementById('modal-publicar').classList.remove('abierto');
            document.body.style.overflow = '';
            resetearModal();
        }
        function cerrarModalSiFondo(e) { if (e.target.id === 'modal-publicar') cerrarModalPublicar(); }
        function resetearModal() {
            ['pub-titulo','pub-categoria','pub-descripcion'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('input-imagen').value = '';
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('preview-placeholder').style.display = 'flex';
            document.getElementById('pub-error').style.display = 'none';
            document.getElementById('btn-pub-texto').textContent = '🚀 Publicar';
            document.getElementById('btn-enviar-pub').disabled = false;
        }

        document.getElementById('preview-zona').addEventListener('click', () => document.getElementById('input-imagen').click());

        const pz = document.getElementById('preview-zona');
        pz.addEventListener('dragover', e => { e.preventDefault(); pz.classList.add('drag-over'); });
        pz.addEventListener('dragleave', () => pz.classList.remove('drag-over'));
        pz.addEventListener('drop', e => {
            e.preventDefault(); pz.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer(); dt.items.add(file);
                document.getElementById('input-imagen').files = dt.files;
                mostrarPreview(file);
            }
        });

        function previsualizarImagen(e) { const f = e.target.files[0]; if(f) mostrarPreview(f); }
        function mostrarPreview(file) {
            const r = new FileReader();
            r.onload = ev => {
                document.getElementById('preview-img').src = ev.target.result;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('preview-placeholder').style.display = 'none';
            };
            r.readAsDataURL(file);
        }

        async function enviarPublicacion() {
            const titulo      = document.getElementById('pub-titulo').value.trim();
            const categoria   = document.getElementById('pub-categoria').value.trim() || 'General';
            const descripcion = document.getElementById('pub-descripcion').value.trim();
            const fileInput   = document.getElementById('input-imagen');
            const errorDiv    = document.getElementById('pub-error');

            errorDiv.style.display = 'none';
            if (!titulo)                                 { mostrarError('El título es obligatorio.'); return; }
            if (!fileInput.files || !fileInput.files[0]) { mostrarError('Debes seleccionar una imagen.'); return; }

            const btn = document.getElementById('btn-enviar-pub');
            btn.disabled = true;
            document.getElementById('btn-pub-texto').textContent = '⏳ Subiendo...';
            const file = fileInput.files[0];


            try {
                // Paso 1: Obtener presigned URL del backend
                document.getElementById('btn-pub-texto').textContent = '⏳ Preparando subida...';
                const uploadUrlRes = await fetch(`${API_BASE}/upload-url`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        filename: file.name,
                        contentType: file.type
                    })
                });
                const uploadUrlData = await uploadUrlRes.json();
                if (!uploadUrlRes.ok) throw new Error(uploadUrlData.detail || 'Error al obtener URL de subida');

                // Paso 2: Subir archivo directamente a S3
                document.getElementById('btn-pub-texto').textContent = '⏳ Subiendo a S3...';
                const s3Res = await fetch(uploadUrlData.url, {
                    method: 'PUT',
                    body: file,
                    headers: {'Content-Type': file.type}
                });
                if (!s3Res.ok) throw new Error('Error al subir archivo a S3');

                // Paso 3: Registrar el post en la base de datos
                document.getElementById('btn-pub-texto').textContent = '⏳ Registrando publicación...';
                const registerRes = await fetch(`${API_BASE}/register-post`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        s3_key: uploadUrlData.key,
                        title: titulo,
                        description: descripcion,
                        user: username
                    })
                });
                const registerData = await registerRes.json();
                if (!registerRes.ok) throw new Error(registerData.detail || 'Error al registrar publicación');
                cerrarModalPublicar();
                await cargarMisPosts();
            } catch(err) {
                mostrarError(err.message);
                btn.disabled = false;
                document.getElementById('btn-pub-texto').textContent = '🚀 Publicar';
            }
        }

        function mostrarError(msg) {
            const el = document.getElementById('pub-error');
            el.textContent = msg; el.style.display = 'block';
        }
    </script>

    <script src="/sidebar.js"></script>
