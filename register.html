<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Piterest</title>
    <meta name="description" content="Crea tu cuenta en Piterest y empieza a compartir tus ideas.">
    <link rel="stylesheet" href="register.css">
    <script src="/config.js"></script>
    <style>
        .alerta {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        .alerta-error  { background-color: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid #ef4444; }
        .alerta-exito  { background-color: rgba(16,185,129,0.2); color: #10b981; border: 1px solid #10b981; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>

<body>
    <div class="contenedor">
        <div class="registro-box">

            <a href="index.html" style="text-decoration:none;color:#7b2cbf;display:block;margin-bottom:10px;font-weight:bold;">&larr; Volver al inicio</a>
            <h1>Crear Cuenta</h1>
            <p>Únete y comparte tus ideas</p>

            <div id="alerta" class="alerta" style="display:none;"></div>

            <form>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ingresa tu apellido" required>
                </div>

                <div class="campo">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" placeholder="Ingresa tu nombre de usuario" required>
                </div>

                <div class="campo">
                    <label>Sexo</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sexo" value="hombre" required> Hombre</label>
                        <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
                        <label><input type="radio" name="sexo" value="otro"> Otro</label>
                    </div>
                </div>

                <div class="campo">
                    <label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" placeholder="Confirma tu contraseña" required>
                </div>

                <button type="submit">Registrarse</button>
            </form>

            <div class="login-link">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>

        </div>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username        = document.getElementById('username').value.trim();
            const email           = document.getElementById('correo').value.trim();
            const password        = document.getElementById('password').value;
            const confirmar       = document.getElementById('confirmar').value;
            const fechaNacimiento = document.getElementById('fechaNacimiento').value; // YYYY-MM-DD
            const alerta          = document.getElementById('alerta');

            alerta.style.display = 'none';
            alerta.className = 'alerta';

            if (password !== confirmar) {
                alerta.textContent = 'Las contraseñas no coinciden';
                alerta.classList.add('alerta-error');
                alerta.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        birthdate: fechaNacimiento || null   // se envía la fecha al backend
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alerta.textContent = '¡Usuario registrado correctamente! Redirigiendo al login...';
                    alerta.classList.add('alerta-exito');
                    alerta.style.display = 'block';
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    alerta.textContent = data.detail || 'Error en el registro';
                    alerta.classList.add('alerta-error');
                    alerta.style.display = 'block';
                }
            } catch (error) {
                alerta.textContent = 'Error de conexión con el servidor';
                alerta.classList.add('alerta-error');
                alerta.style.display = 'block';
            }
        });
    </script>
</body>

</html>
