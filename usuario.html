<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Piterest proyecto</title>
    <meta name="description" content="Tu perfil en Piterest: gestiona tu foto, bio y publicaciones.">
    <link rel="stylesheet" href="usuario.css">
    <script>
        // Protección de ruta inmediata antes de renderizar la página
        if (!sessionStorage.getItem('username')) {
            window.location.href = "login.html";
        }
    </script>
</head>

<body>

    <header class="header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>Piterest proyecto</h1>
            </a>
        </div>

        <div class="header-acciones">
            <!-- Botón Publicar en el header -->
            <button class="btn-publicar-header" id="btn-pub-header" onclick="abrirModalPublicar()">
                ＋ Publicar
            </button>

            <div class="settings">
                <button class="settings-btn" onclick="toggleMenu()">Configuración</button>
                <div class="settings-menu" id="settingsMenu">
                    <label>
                        <input type="checkbox">
                        Mostrar contenido para adultos
                    </label>
                    <label>
                        <input type="checkbox">
                        Perfil privado
                    </label>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 10px 0;">
                    <button onclick="cerrarSesion()" style="width:100%;padding:8px;background-color:#ef4444;color:white;border:none;border-radius:5px;font-weight:bold;cursor:pointer;transition:background 0.2s;">
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sección de perfil -->
    <section class="perfil">
        <div class="foto-perfil-wrapper">
            <div class="foto-perfil" id="foto-perfil-contenedor" title="Haz clic para cambiar tu foto">
                <img id="avatar-img" src="avatar.png" alt="Foto de perfil">
                <div class="foto-overlay">
                    <span>📷 Cambiar</span>
                </div>
                <input type="file" id="input-avatar" accept="image/*" style="display:none;" onchange="subirAvatar(event)">
            </div>
            <div id="avatar-loading" class="avatar-loading" style="display:none;">⏳ Subiendo...</div>
        </div>
        <h2 id="nombre-usuario-perfil" class="nombre-perfil">@Usuario</h2>
        <p id="bio-usuario" class="bio-perfil" style="display:none;"></p>
    </section>

    <!-- Sección de publicaciones -->
    <section class="publicaciones">
        <div class="pub-header">
            <h2>Mis publicaciones</h2>
            <button class="btn-pub-inline" onclick="abrirModalPublicar()">＋ Nueva publicación</button>
        </div>

        <div class="galeria" id="galeria-usuario">
            <div class="pub-cargando" id="pub-cargando">
                <div class="spinner"></div>
                <p>Cargando publicaciones...</p>
            </div>
        </div>
    </section>

    <!-- Botón flotante publicar -->
    <button class="fab-publicar visible" id="fab-publicar" title="Publicar imagen" onclick="abrirModalPublicar()">
        <span class="fab-icon">＋</span>
        <span class="fab-label">Publicar</span>
    </button>

    <!-- Modal para publicar imagen -->
    <div class="modal-overlay" id="modal-publicar" onclick="cerrarModalSiFondo(event)">
        <div class="modal-card">
            <button class="modal-close" onclick="cerrarModalPublicar()" title="Cerrar">✕</button>
            <h2 class="modal-title">✨ Nueva publicación</h2>

            <div class="preview-zona" id="preview-zona">
                <div class="preview-placeholder" id="preview-placeholder">
                    <div class="preview-icon">🖼️</div>
                    <p>Haz clic o arrastra una imagen aquí</p>
                </div>
                <img id="preview-img" class="preview-img" alt="Vista previa" style="display:none;">
                <input type="file" id="input-imagen" accept="image/*" style="display:none;" onchange="previsualizarImagen(event)">
            </div>

            <div class="modal-campos">
                <input type="text" id="pub-titulo" class="modal-input" placeholder="Título de la publicación *" maxlength="100">

                <input type="text" id="pub-categoria" class="modal-input" placeholder="Categoría (ej: Arte, Viajes, tu propia...)" list="categorias-sugeridas" maxlength="50">
                <datalist id="categorias-sugeridas">
                    <option value="Arte">
                    <option value="Fotografía">
                    <option value="Diseño">
                    <option value="Naturaleza">
                    <option value="Tecnología">
                    <option value="Comida">
                    <option value="Viajes">
                </datalist>

                <textarea id="pub-descripcion" class="modal-textarea" placeholder="Descripción (opcional)" maxlength="300" rows="3"></textarea>

                <div id="pub-error" class="pub-error" style="display:none;"></div>

                <button class="btn-publicar-modal" id="btn-enviar-pub" onclick="enviarPublicacion()">
                    <span id="btn-pub-texto">🚀 Publicar</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        const username = sessionStorage.getItem('username');

        // ── Carga inicial ────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            if (username) {
                document.getElementById('nombre-usuario-perfil').textContent = '@' + username;
                await cargarPerfil();
                await cargarMisPosts();
            }
        });

        // ── Perfil / Avatar ──────────────────────────────────────────────────
        async function cargarPerfil() {
            try {
                const res = await fetch(`${API}/profile/${encodeURIComponent(username)}`);
                if (!res.ok) return;
                const data = await res.json();

                if (data.avatar_url) {
                    document.getElementById('avatar-img').src = data.avatar_url + '?t=' + Date.now();
                }
                if (data.bio) {
                    const bioEl = document.getElementById('bio-usuario');
                    bioEl.textContent = data.bio;
                    bioEl.style.display = 'block';
                }
            } catch (e) {
                // No es crítico si falla
            }
        }

        document.getElementById('foto-perfil-contenedor').addEventListener('click', () => {
            document.getElementById('input-avatar').click();
        });

        async function subirAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('avatar-loading');
            loading.style.display = 'block';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('file', file);

            try {
                const res = await fetch(`${API}/upload-avatar`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al subir avatar');
                document.getElementById('avatar-img').src = data.avatar_url + '?t=' + Date.now();
            } catch (err) {
                alert('Error al cambiar la foto: ' + err.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        // ── Mis publicaciones ────────────────────────────────────────────────
        async function cargarMisPosts() {
            const galeria = document.getElementById('galeria-usuario');
            try {
                const res = await fetch(`${API}/posts/user/${encodeURIComponent(username)}`);
                if (!res.ok) throw new Error();
                const posts = await res.json();

                document.getElementById('pub-cargando').style.display = 'none';

                if (posts.length === 0) {
                    galeria.innerHTML = `
                        <div class="sin-posts">
                            <div class="sin-posts-icon">📸</div>
                            <p>Todavía no has publicado nada.</p>
                            <button onclick="abrirModalPublicar()" class="btn-primera-pub">Haz tu primera publicación</button>
                        </div>`;
                    return;
                }

                galeria.innerHTML = '';
                posts.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <img src="${p.image_url}" alt="${p.title}" loading="lazy"
                             onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&h=600&fit=crop'">
                        <div class="post-info">
                            <h3>${p.title}</h3>
                            <span class="post-cat">${p.category || 'General'}</span>
                        </div>
                    `;
                    galeria.appendChild(div);
                });
            } catch (e) {
                document.getElementById('pub-cargando').style.display = 'none';
                galeria.innerHTML = `<p style="color:#aaa;padding:20px;">No se pudieron cargar las publicaciones.</p>`;
            }
        }

        // ── Modal publicar ───────────────────────────────────────────────────
        function abrirModalPublicar() {
            document.getElementById('modal-publicar').classList.add('abierto');
            document.body.style.overflow = 'hidden';
        }

        function cerrarModalPublicar() {
            document.getElementById('modal-publicar').classList.remove('abierto');
            document.body.style.overflow = '';
            resetearModal();
        }

        function cerrarModalSiFondo(e) {
            if (e.target.id === 'modal-publicar') cerrarModalPublicar();
        }

        function resetearModal() {
            document.getElementById('pub-titulo').value = '';
            document.getElementById('pub-categoria').value = '';
            document.getElementById('pub-descripcion').value = '';
            document.getElementById('input-imagen').value = '';
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('preview-placeholder').style.display = 'flex';
            document.getElementById('pub-error').style.display = 'none';
            document.getElementById('btn-pub-texto').textContent = '🚀 Publicar';
            document.getElementById('btn-enviar-pub').disabled = false;
        }

        document.getElementById('preview-zona').addEventListener('click', () => {
            document.getElementById('input-imagen').click();
        });

        const previewZona = document.getElementById('preview-zona');
        previewZona.addEventListener('dragover', e => { e.preventDefault(); previewZona.classList.add('drag-over'); });
        previewZona.addEventListener('dragleave', () => previewZona.classList.remove('drag-over'));
        previewZona.addEventListener('drop', e => {
            e.preventDefault();
            previewZona.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const dt = new DataTransfer();
                dt.items.add(file);
                document.getElementById('input-imagen').files = dt.files;
                mostrarPreview(file);
            }
        });

        function previsualizarImagen(e) {
            const file = e.target.files[0];
            if (file) mostrarPreview(file);
        }

        function mostrarPreview(file) {
            const reader = new FileReader();
            reader.onload = ev => {
                document.getElementById('preview-img').src = ev.target.result;
                document.getElementById('preview-img').style.display = 'block';
                document.getElementById('preview-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        async function enviarPublicacion() {
            const titulo = document.getElementById('pub-titulo').value.trim();
            const categoria = document.getElementById('pub-categoria').value.trim() || 'General';
            const descripcion = document.getElementById('pub-descripcion').value.trim();
            const fileInput = document.getElementById('input-imagen');
            const errorDiv = document.getElementById('pub-error');

            errorDiv.style.display = 'none';

            if (!titulo) { mostrarError('El título es obligatorio.'); return; }
            if (!fileInput.files || !fileInput.files[0]) { mostrarError('Debes seleccionar una imagen.'); return; }

            const btn = document.getElementById('btn-enviar-pub');
            btn.disabled = true;
            document.getElementById('btn-pub-texto').textContent = '⏳ Subiendo...';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('title', titulo);
            formData.append('category', categoria);
            formData.append('description', descripcion);
            formData.append('file', fileInput.files[0]);

            try {
                const res = await fetch(`${API}/upload-post`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Error al publicar');
                cerrarModalPublicar();
                await cargarMisPosts();
            } catch (err) {
                mostrarError(err.message);
                btn.disabled = false;
                document.getElementById('btn-pub-texto').textContent = '🚀 Publicar';
            }
        }

        function mostrarError(msg) {
            const errorDiv = document.getElementById('pub-error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        // ── Configuración ────────────────────────────────────────────────────
        function toggleMenu() {
            const menu = document.getElementById('settingsMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function cerrarSesion() {
            sessionStorage.removeItem('username');
            window.location.href = 'index.html';
        }
    </script>

</body>

</html>
